                                  <label><b>Complementos bajos</b></label>
                                  <select ui-select2 class="form-control input-sm" formControlName="complementosBajos"
                                    uppercase>
                                    <option value=null>Seleccione</option>
                                    <option *ngFor="let item of listaRespuesta; let i = index" value="{{item.descripcionValor}}" >
                                      {{item.descripcionValor}}
                                    </option>
                                  </select>
                                </div>
        

                                <div class="form-group">
                                  <label><b>Síndrome de Sjögren secundario</b></label>
                                  <select ui-select2 class="form-control input-sm" formControlName="factoresRiesgoSindromeSjogren"
                                    uppercase>
                                    <option value=null>Seleccione</option>
                                    <option *ngFor="let item of listaRespuesta; let i = index" value="{{item.descripcionValor}}" >
                                      {{item.descripcionValor}}
                                    </option>
                                  </select>
                                </div>

                                <div class="form-group">
                                  <label><b>Leucopenia</b></label>
                                  <select #refL ui-select2 class="form-control input-sm" formControlName="factoresRiesgoLeucopenia"  (change)="getSelectedValueL(refL.value)"
                                    uppercase>
                                    <option value=null>Seleccione</option>
                                    <option *ngFor="let item of listaRespuesta; let i = index" value="{{item.descripcionValor}}">
                                      {{item.descripcionValor}}
                                    </option>
                                  </select>
                                </div>

                                <div *ngIf="elementL == true" style="background-color: #FAE9EF;">
                                  <div class="row">
                                    <div class="col">
                
                                    </div>
                                    
                                    <div class="col bg-light">
                                      <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" formControlName="factoresRiesgoTipoLeucopenia"   id="inlineCheckbox1" value="Linfopenia"  >
                                        <label class="form-check-label" for="inlineCheckbox1">Linfopenia</label>
                                      </div> 
                                     
                                    <div class="form-check form-check-inline">
                                      <input class="form-check-input" type="radio" formControlName="factoresRiesgoTipoLeucopenia"   id="inlineCheckbox1" value="Neutropenia"  >
                                      <label class="form-check-label" for="inlineCheckbox1">Neutropenia</label>
                                      </div> 
                
                                      <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" formControlName="factoresRiesgoTipoLeucopenia"   id="inlineCheckbox1" value="Ambos"  >
                                        <label class="form-check-label" for="inlineCheckbox1">Ambos</label>
                                        </div>   
                    
                                    
                                    </div>
                                    
                                    </div>
                                
                                  </div>

                               

                                <div class="form-group">
                                  <label><b>SLEDAI (puntos de 0 a 30)</b></label>
                                  <input type="number" min="0" max="30" class="form-control" formControlName="sledaiPuntos0A30" name="sledaiPuntos0A30"
                                    placeholder="...">
                
                                </div>
                              </div>
                         
                            
                              </div>
                            
                            </div>

                          </div>
                        </div>

                       






                        <br />
                        <div class="card"  style="background-color: #fc805b ;">
                          <div class="card-body">
                            <div class="form-group">
                              <label><b>Fecha de Ingreso-(Formato dia/mes/año)</b></label>
                              <input type="date" class="form-control" 
                                  formControlName="fechaIngreso" name="fechaIngreso"
                                  placeholder="...">
                        
                          </div>
                          </div>
                        </div>
                        <div class="card">
                          <div class="card-body">
                            <div class="form-group">
                              <label><b>Encargado de registro (Nombre y Apellido de quien cargo) </b></label>
                              <input type="text" class="form-control"
                                  formControlName="firmaEncargado"
                                  name="firmaEncargado" placeholder="..." [class.is-invalid]="firmaEncargadoNoValido">
                                  <small *ngIf="firmaEncargadoNoValido" class="text-danger">
                                    Ingrese firma
                                  </small>
                            </div>
          
                          </div>
          
                         </div>
                        <!--Personas Fechas-->
                        <div class="form-row justify-content-center" [hidden]="crear" style="display: none;">
                            <div class="col-lg-5">
                                <label><b>Fecha creaci&oacute;n</b></label>
                                <input type="datetime-local" class="form-control" formControlName="fechaCreacion"
                                    name="fechaCreacion" placeholder="Fecha creaci&oacute;n">

                                <label><b>Fecha modificaci&oacute;n</b></label>
                                <input type="datetime-local" class="form-control" formControlName="fechaModificacion"
                                    name="fechaModificacion" placeholder="Fecha modificaci&oacute;n">
                            </div>
                            <div class="col-lg-5">
                                <label><b>Usuario creaci&oacute;n</b></label>
                                <input type="text" class="form-control" formControlName="usuarioCreacion"
                                    name="usuarioCreacion" placeholder="Usuario creaci&oacute;n">

                                <label><b>Usuario modificaci&oacute;n</b></label>
                                <input type="text" class="form-control" formControlName="usuarioModificacion"
                                    name="usuarioModificacion" placeholder="Usuario modificaci&oacute;n">
                            </div>
                            <div class="form-group">
                                <label><b>PersonaID</b></label>
                                <input type="text" class="form-control" formControlName="personas" name="personas"
                                  placeholder="...">
                
                              </div>
                        </div>
                        <hr>
                        <br>
                        <div *ngIf="alertGuardar" class="alert alert-danger alert-dismissible fade show text-center"
                            role="alert">
                            Existen campos obligatorios. Verifique.
                            <button type="button" (click)="cerrarAlertGuardar()" class="close" data-dismiss="alert"
                                aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                        <div class="form-group text-center">
                            <button type="submit" class="btn btn-primary ">
                                <i class="fa fa-save"></i>
                                Guardar
                            </button>
                            &nbsp;&nbsp;
                            <button (click)="limpiar($event)" [hidden]="!crear" class="btn btn-warning"><i
                                    class="fas fa-backspace"></i> Limpiar</button>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>
</body>
